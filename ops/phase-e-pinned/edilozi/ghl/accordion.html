<div class="ghl-component-wrapper">
  <style>
    .ghl-component-wrapper {
      --ghl-border: #d1d5db;
      --ghl-bg: #f3f4f6;
      --ghl-bg-dark: #18181b;
      --ghl-fg: #18181b;
      --ghl-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      font-family: var(--ghl-font);
      color: var(--ghl-fg);
      box-sizing: border-box;
    }
    .ghl-component-wrapper *,
    .ghl-component-wrapper *::before,
    .ghl-component-wrapper *::after {
      box-sizing: border-box;
    }
    .ghl-component-wrapper .ghl-accordion-item {
      overflow: hidden;
      background: var(--ghl-bg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      border-bottom: 1px solid var(--ghl-border);
      transition: margin 0.2s ease-in-out;
    }
    .ghl-component-wrapper .ghl-accordion-item:first-child {
      border-top-left-radius: 2px;
      border-top-right-radius: 2px;
    }
    .ghl-component-wrapper .ghl-accordion-item:last-child {
      border-bottom-left-radius: 2px;
      border-bottom-right-radius: 2px;
      border-bottom: none;
    }
    .ghl-component-wrapper .ghl-accordion-summary {
      display: flex;
      width: 100%;
      cursor: pointer;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      font-weight: 500;
      background: transparent;
      border: none;
      text-align: left;
      font-family: var(--ghl-font);
      font-size: 14px;
      color: var(--ghl-fg);
    }
    .ghl-component-wrapper .ghl-chevron {
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .ghl-component-wrapper .ghl-accordion-item[data-expanded="true"] .ghl-chevron {
      transform: rotate(180deg);
    }
    .ghl-component-wrapper .ghl-accordion-details {
      height: 0;
      overflow: hidden;
      transition: height 0.2s ease-in-out;
    }
    .ghl-component-wrapper .ghl-accordion-details-inner {
      padding: 1px 16px 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #404040;
    }
  </style>

  <div class="ghl-accordion" role="presentation">
    <div class="ghl-accordion-item" data-expanded="false">
      <button type="button" class="ghl-accordion-summary" aria-expanded="false">
        <span>What is HigherBits.dev?</span>
        <span class="ghl-chevron">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
      <div class="ghl-accordion-details">
        <div class="ghl-accordion-details-inner">A curated marketplace for original and MIT-licensed React UI components.</div>
      </div>
    </div>
    <div class="ghl-accordion-item" data-expanded="false">
      <button type="button" class="ghl-accordion-summary" aria-expanded="false">
        <span>Can I use this commercially?</span>
        <span class="ghl-chevron">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
      <div class="ghl-accordion-details">
        <div class="ghl-accordion-details-inner">Yes, every component here keeps its upstream MIT license intact.</div>
      </div>
    </div>
    <div class="ghl-accordion-item" data-expanded="false">
      <button type="button" class="ghl-accordion-summary" aria-expanded="false">
        <span>Is it accessible?</span>
        <span class="ghl-chevron">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
      <div class="ghl-accordion-details">
        <div class="ghl-accordion-details-inner">It uses native buttons and keyboard-focusable controls throughout.</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      function initInstance(root) {
        var items = root.querySelectorAll(".ghl-accordion-item");
        items.forEach(function (item) {
          var summary = item.querySelector(".ghl-accordion-summary");
          var details = item.querySelector(".ghl-accordion-details");
          var inner = item.querySelector(".ghl-accordion-details-inner");
          summary.addEventListener("click", function () {
            var expanded = item.getAttribute("data-expanded") === "true";
            var next = !expanded;
            item.setAttribute("data-expanded", String(next));
            summary.setAttribute("aria-expanded", String(next));
            details.style.height = next ? inner.offsetHeight + "px" : "0px";
          });
        });
      }
      var wrapper = document.currentScript && document.currentScript.closest(".ghl-component-wrapper");
      if (wrapper) initInstance(wrapper);
    })();
  </script>
</div>
