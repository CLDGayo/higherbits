<div class="ghl-component-wrapper">
  <style>
    .ghl-component-wrapper {
      --ghl-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: var(--ghl-font);
    }
    .ghl-component-wrapper *,
    .ghl-component-wrapper *::before,
    .ghl-component-wrapper *::after {
      box-sizing: border-box;
    }
    .ghl-component-wrapper .ghl-pricing-card {
      position: relative;
      width: 100%;
      max-width: 300px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #334155;
      background: linear-gradient(to bottom right, #334155, #1e293b);
      padding: 32px;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
    }
    .ghl-component-wrapper .ghl-pricing-heading {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
    }
    .ghl-component-wrapper .ghl-pricing-description {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }
    .ghl-component-wrapper .ghl-pricing-amount-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 16px 0 12px;
    }
    .ghl-component-wrapper .ghl-pricing-amount {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
    }
    .ghl-component-wrapper .ghl-pricing-strike {
      color: #9ca3af;
      text-decoration: line-through;
      font-size: 16px;
    }
    .ghl-component-wrapper .ghl-pricing-ribbon {
      position: absolute;
      right: -50%;
      top: 0;
      width: 100%;
      transform: translate(-24px, 16px) rotate(45deg);
      background: linear-gradient(to right, #475569, #334155);
      text-align: center;
      color: #ffffff;
      font-size: 16px;
    }
    .ghl-component-wrapper .ghl-pricing-btn {
      width: 100%;
      border-radius: 6px;
      background: linear-gradient(to right, #475569, #334155);
      padding: 8px 24px;
      text-align: center;
      font-weight: 500;
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .ghl-component-wrapper .ghl-pricing-btn:hover {
      background: #475569;
    }
    .ghl-component-wrapper .ghl-pricing-list {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      color: #e5e7eb;
      font-size: 16px;
    }
    .ghl-component-wrapper .ghl-pricing-list h5 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .ghl-component-wrapper .ghl-pricing-list li {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }
    .ghl-component-wrapper .ghl-pricing-check {
      margin-right: 8px;
      height: 20px;
      min-width: 20px;
      color: #10b981;
    }
  </style>

  <div class="ghl-pricing-card">
    <div>
      <h3 class="ghl-pricing-heading">Pro</h3>
      <p class="ghl-pricing-description">For growing teams</p>
    </div>
    <div>
      <div class="ghl-pricing-amount-row">
        <span class="ghl-pricing-amount">$23</span>
        <span class="ghl-pricing-strike">29$</span>
      </div>
      <div class="ghl-pricing-ribbon">20%</div>
      <button type="button" class="ghl-pricing-btn">Get started</button>
      <ul class="ghl-pricing-list">
        <h5>Includes</h5>
        <li><svg class="ghl-pricing-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>Unlimited projects</span></li>
        <li><svg class="ghl-pricing-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>Priority support</span></li>
        <li><svg class="ghl-pricing-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>Private components</span></li>
      </ul>
    </div>
  </div>

  <script>
    (() => {
      function initInstance(root) {
        var button = root.querySelector(".ghl-pricing-btn");
        if (!button) return;
        var originalText = button.textContent;
        button.addEventListener("click", function () {
          button.textContent = "Selected!";
          setTimeout(function () {
            button.textContent = originalText;
          }, 1200);
        });
      }
      var wrapper = document.currentScript && document.currentScript.closest(".ghl-component-wrapper");
      if (wrapper) initInstance(wrapper);
    })();
  </script>
</div>
