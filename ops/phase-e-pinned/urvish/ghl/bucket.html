<div class="ghl-component-wrapper"><style>
.ghl-component-wrapper{font-family:Arial,sans-serif;min-height:350px;display:flex;align-items:center;justify-content:center;background:#fff;color:#111827;padding:10px}.ghl-component-wrapper *{box-sizing:border-box}.ghl-component-wrapper .bu-stage{position:relative;width:min(100%,655px);height:352px;perspective:850px;isolation:isolate}.ghl-component-wrapper .bu-bucket{position:absolute;left:11%;right:11%;top:22%;height:57%;filter:drop-shadow(0 18px 12px #cbd5e180)}.ghl-component-wrapper .bu-back{position:absolute;left:8%;right:8%;top:-19%;height:32%;background:#fff;border:1px solid #e9edf3;border-radius:16px 16px 3px 3px;transform:perspective(500px) rotateX(-38deg);box-shadow:0 -3px 14px #e8ecf2}.ghl-component-wrapper .bu-left,.ghl-component-wrapper .bu-right{position:absolute;top:-20%;width:31%;height:37%;background:linear-gradient(135deg,#fff,#f7f8fa);border:1px solid #e8ecf3;box-shadow:0 8px 12px #d5dae250}.ghl-component-wrapper .bu-left{left:-12%;clip-path:polygon(40% 0,100% 42%,58% 100%,0 45%)}.ghl-component-wrapper .bu-right{right:-12%;clip-path:polygon(60% 0,100% 45%,42% 100%,0 42%)}.ghl-component-wrapper .bu-front{position:absolute;left:0;right:0;top:22%;bottom:0;background:linear-gradient(160deg,#fff 15%,#f8f9fb 100%);border:1px solid #e4e8ef;clip-path:polygon(10% 0,90% 0,100% 94%,98% 100%,2% 100%,0 94%);border-radius:6px 6px 12px 12px;box-shadow:inset 0 -4px 8px #e7ebf3}.ghl-component-wrapper .bu-rim{position:absolute;left:9%;right:9%;top:20%;height:5%;background:linear-gradient(#f8fafc,#fff);border:1px solid #e6e9ee;border-radius:50%;z-index:2}.ghl-component-wrapper .bu-chip{position:absolute;z-index:4;left:50%;top:28%;transform:translate(-50%,-15px);width:240px;max-width:64%;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #dfe4ea;border-radius:999px;background:white;box-shadow:0 8px 18px #0002;opacity:0;transition:transform .45s,opacity .45s}.ghl-component-wrapper .bu-chip.show{transform:translate(-50%,0);opacity:1}.ghl-component-wrapper .bu-icon{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#f1f3f5;border-radius:50%;font-size:18px;color:#667085}.ghl-component-wrapper .bu-chip strong{display:block;font-size:13px;white-space:nowrap}.ghl-component-wrapper .bu-chip small{display:block;margin-top:4px;color:#667085;font-size:11px;white-space:nowrap}.ghl-component-wrapper .bu-dot{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;color:#94a3b8}
</style><div class="bu-stage" aria-label="Rotating feature cards in an open box"><div class="bu-bucket"><div class="bu-back"></div><div class="bu-left"></div><div class="bu-right"></div><div class="bu-rim"></div><div class="bu-front"></div></div><div class="bu-chip" aria-live="polite"><div class="bu-icon">✓</div><div><strong>Production Ready</strong><small>Fully type-safe and tested</small></div></div><div class="bu-dot" aria-hidden="true">● ● ● ●</div></div><script>(()=>{const host=document.currentScript.parentElement,chip=host.querySelector('.bu-chip'),icon=chip.querySelector('.bu-icon'),title=chip.querySelector('strong'),desc=chip.querySelector('small');const items=[['✓','Production Ready','Fully type-safe and tested'],['ϟ','Fluid Motion','60fps optimizations built-in'],['♧','Accessible','Works perfectly for everyone'],['✦','Modern Design','Crafted for high-end feel']];let i=0;function draw(){chip.classList.remove('show');setTimeout(()=>{const item=items[i++%items.length];icon.textContent=item[0];title.textContent=item[1];desc.textContent=item[2];chip.classList.add('show')},180)}draw();const timer=setInterval(draw,2000);const observer=new MutationObserver(()=>{if(!host.isConnected){clearInterval(timer);observer.disconnect()}});observer.observe(document.documentElement,{childList:true,subtree:true})})();</script></div>
