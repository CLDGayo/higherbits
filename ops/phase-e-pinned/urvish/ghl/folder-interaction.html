<style>
.ghl-component-wrapper {
  box-sizing: border-box;
  width: 100%;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.ghl-component-wrapper *,
.ghl-component-wrapper *::before,
.ghl-component-wrapper *::after {
  box-sizing: border-box;
}

.ghl-component-wrapper .ghl-folder-trigger {
  position: relative;
  width: 320px;
  height: 208px;
  padding: 0;
  margin: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  display: block;
  outline: none;
  perspective: 1000px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.ghl-component-wrapper .ghl-folder-trigger:focus-visible {
  outline: 2px solid #8B5CF6;
  outline-offset: 6px;
  border-radius: 12px;
}

.ghl-component-wrapper .ghl-folder-back {
  position: relative;
  width: 87.5%;
  height: 100%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #18151B;
  box-shadow: 0px 0px 15.7px 16px rgba(79, 73, 85, 0.30) inset;
  border-radius: 10px;
}

.ghl-component-wrapper .ghl-folder-page {
  position: absolute;
  top: 8px;
  width: 128px;
  height: auto;
  border-radius: 12px;
  pointer-events: none;
  will-change: transform;
}

.ghl-component-wrapper .ghl-page-card {
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, #E8E7F0, #DCDAE8);
  border-radius: 12px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  padding: 12px;
}

@media (min-width: 640px) {
  .ghl-component-wrapper .ghl-page-card {
    padding: 16px;
  }
}

.ghl-component-wrapper .ghl-page-lines {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

@media (min-width: 640px) {
  .ghl-component-wrapper .ghl-page-lines {
    gap: 8px;
  }
}

.ghl-component-wrapper .ghl-page-line-top {
  width: 100%;
  height: 4px;
  background: #CFCDE0;
  border-radius: 9999px;
}

@media (min-width: 640px) {
  .ghl-component-wrapper .ghl-page-line-top {
    height: 6px;
  }
}

.ghl-component-wrapper .ghl-page-row {
  display: flex;
  gap: 6px;
}

@media (min-width: 640px) {
  .ghl-component-wrapper .ghl-page-row {
    gap: 8px;
  }
}

.ghl-component-wrapper .ghl-page-line-sub {
  flex: 1;
  height: 4px;
  background: #CFCDE0;
  border-radius: 9999px;
}

@media (min-width: 640px) {
  .ghl-component-wrapper .ghl-page-line-sub {
    height: 6px;
  }
}

.ghl-component-wrapper .ghl-page-0 {
  z-index: 10;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  transform: translate3d(-38px, 2px, 0) rotate(-3deg);
  transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
}

.ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-0 {
  transform: translate3d(-70px, -55px, 0) rotate(-8deg);
}

.ghl-component-wrapper .ghl-page-1 {
  z-index: 20;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  transform: translate3d(0px, 0px, 0) rotate(0deg);
  transition: transform 0.55s cubic-bezier(0.34, 1.35, 0.64, 1);
}

.ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-1 {
  transform: translate3d(2px, -75px, 0) rotate(1deg);
}

.ghl-component-wrapper .ghl-page-2 {
  z-index: 10;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  transform: translate3d(42px, 1px, 0) rotate(3.5deg);
  transition: transform 0.58s cubic-bezier(0.34, 1.45, 0.64, 1);
}

.ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-2 {
  transform: translate3d(75px, -60px, 0) rotate(9deg);
}

.ghl-component-wrapper .ghl-folder-flap {
  position: absolute;
  left: -1px;
  right: -1px;
  bottom: -1px;
  z-index: 20;
  height: 176px;
  border-radius: 24px;
  transform-origin: bottom center;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: visible;
  transform: rotateX(0deg);
  transition: transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
  transform-style: preserve-3d;
  pointer-events: none;
  will-change: transform;
}

.ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-folder-flap {
  transform: rotateX(-40deg);
}

.ghl-component-wrapper .ghl-folder-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  display: block;
}
</style>
