  <script>
    (function () {
      const stepMeta = [
        {
          title: "Create New Project",
          description: "Start by providing the essential details for your workspace."
        },
        {
          title: "Configuration",
          description: "Define team access and project priority settings."
        },
        {
          title: "Project Kickoff Mood",
          description: "How confident do you feel about this new project?"
        }
      ];

      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      document.querySelectorAll(".ghl-component-wrapper").forEach(function (wrapper) {
        let currentStep = 0;
        let selectedDate = null;
        let activeCalYear = new Date().getFullYear();
        let activeCalMonth = new Date().getMonth();
        let tags = [];
        let selectedMood = "";

        const titleEl = wrapper.querySelector(".msf-title");
        const descEl = wrapper.querySelector(".msf-description");
        const pills = wrapper.querySelectorAll(".msf-pill");
        const stepViews = wrapper.querySelectorAll(".msf-step-view");
        const backBtn = wrapper.querySelector(".msf-back-btn");
        const nextBtn = wrapper.querySelector(".msf-next-btn");
        const nextText = wrapper.querySelector(".msf-next-text");
        const nextIcon = wrapper.querySelector(".msf-next-icon");

        const dateBtn = wrapper.querySelector(".msf-date-btn");
        const dateLabel = wrapper.querySelector(".msf-date-label");
        const datePopover = wrapper.querySelector(".msf-date-popover");
        const calTitle = wrapper.querySelector(".msf-cal-title");
        const calDays = wrapper.querySelector(".msf-cal-days");
        const calPrev = wrapper.querySelector(".msf-cal-prev");
        const calNext = wrapper.querySelector(".msf-cal-next");

        const projectNameInput = wrapper.querySelector("#msf-project-name");
        const descriptionInput = wrapper.querySelector("#msf-description");
        const teamSizeSelect = wrapper.querySelector("#msf-team-size");
        const prioritySelect = wrapper.querySelector("#msf-priority");
        const tagInput = wrapper.querySelector("#msf-tag-input");
        const tagsList = wrapper.querySelector(".msf-tags-list");
        const moodBtns = wrapper.querySelectorAll(".msf-mood-btn");
        const commentInput = wrapper.querySelector("#msf-comment");
        const toastBox = wrapper.querySelector(".msf-toast-box");
        const toastCode = wrapper.querySelector(".msf-toast-pre code");

        function updateStepUI() {
          titleEl.textContent = stepMeta[currentStep].title;
          descEl.textContent = stepMeta[currentStep].description;

          pills.forEach(function (pill, idx) {
            if (idx === currentStep) {
              pill.classList.add("active");
            } else {
              pill.classList.remove("active");
            }
          });

          stepViews.forEach(function (view, idx) {
            if (idx === currentStep) {
              view.classList.add("active");
            } else {
              view.classList.remove("active");
            }
          });

          backBtn.disabled = currentStep === 0;

          if (currentStep === stepMeta.length - 1) {
            nextText.textContent = "Finish";
            nextIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
          } else {
            nextText.textContent = "Continue";
            nextIcon.innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
          }
        }

        function formatDisplayDate(date) {
          const month = monthNames[date.getMonth()];
          const day = date.getDate();
          const year = date.getFullYear();
          return month + " " + day + ", " + year;
        }

        function renderCalendar() {
          calTitle.textContent = monthNames[activeCalMonth] + " " + activeCalYear;
          calDays.innerHTML = "";

          const firstDayIndex = new Date(activeCalYear, activeCalMonth, 1).getDay();
          const daysInMonth = new Date(activeCalYear, activeCalMonth + 1, 0).getDate();

          for (let i = 0; i < firstDayIndex; i++) {
            const blank = document.createElement("div");
            blank.className = "msf-cal-day empty";
            calDays.appendChild(blank);
          }

          for (let d = 1; d <= daysInMonth; d++) {
            const dayBtn = document.createElement("button");
            dayBtn.type = "button";
            dayBtn.className = "msf-cal-day";
            dayBtn.textContent = d;

            if (
              selectedDate &&
              selectedDate.getFullYear() === activeCalYear &&
              selectedDate.getMonth() === activeCalMonth &&
              selectedDate.getDate() === d
            ) {
              dayBtn.classList.add("selected");
            }

            dayBtn.addEventListener("click", function () {
              selectedDate = new Date(activeCalYear, activeCalMonth, d);
              dateLabel.textContent = formatDisplayDate(selectedDate);
              dateBtn.classList.add("has-value");
              datePopover.classList.remove("open");
              renderCalendar();
            });

            calDays.appendChild(dayBtn);
          }
        }

        dateBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          const isOpen = datePopover.classList.contains("open");
          if (!isOpen) {
            renderCalendar();
            datePopover.classList.add("open");
          } else {
            datePopover.classList.remove("open");
          }
        });

        calPrev.addEventListener("click", function (e) {
          e.stopPropagation();
          activeCalMonth--;
          if (activeCalMonth < 0) {
            activeCalMonth = 11;
            activeCalYear--;
          }
          renderCalendar();
        });

        calNext.addEventListener("click", function (e) {
          e.stopPropagation();
          activeCalMonth++;
          if (activeCalMonth > 11) {
            activeCalMonth = 0;
            activeCalYear++;
          }
          renderCalendar();
        });

        document.addEventListener("click", function (e) {
          if (!datePopover.contains(e.target) && !dateBtn.contains(e.target)) {
            datePopover.classList.remove("open");
          }
        });

        function renderTags() {
          tagsList.innerHTML = "";
          tags.forEach(function (tag, index) {
            const badge = document.createElement("span");
            badge.className = "msf-badge";
            badge.textContent = tag;

            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "msf-badge-close";
            removeBtn.setAttribute("aria-label", "Remove tag " + tag);
            removeBtn.textContent = "×";

            removeBtn.addEventListener("click", function () {
              tags.splice(index, 1);
              renderTags();
            });

            badge.appendChild(removeBtn);
            tagsList.appendChild(badge);
          });
        }

        tagInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            const val = tagInput.value.trim();
            if (val && !tags.includes(val)) {
              tags.push(val);
              renderTags();
            }
            tagInput.value = "";
          }
        });

        moodBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            const mood = btn.getAttribute("data-mood");
            if (selectedMood === mood) {
              selectedMood = "";
              btn.classList.remove("selected");
            } else {
              selectedMood = mood;
              moodBtns.forEach(function (b) {
                b.classList.remove("selected");
              });
              btn.classList.add("selected");
            }
          });
        });

        let toastTimeout = null;
        function showToast(data) {
          toastCode.textContent = JSON.stringify(data, null, 2);
          toastBox.classList.add("show");
          if (toastTimeout) clearTimeout(toastTimeout);
          toastTimeout = setTimeout(function () {
            toastBox.classList.remove("show");
          }, 6000);
        }

        backBtn.addEventListener("click", function () {
          if (currentStep > 0) {
            currentStep--;
            updateStepUI();
          }
        });

        nextBtn.addEventListener("click", function () {
          if (currentStep === stepMeta.length - 1) {
            const formData = {
              "project-name": projectNameInput.value,
              "due-date": selectedDate ? selectedDate.toISOString() : undefined,
              "description": descriptionInput.value,
              "team-size": teamSizeSelect.value || null,
              "priority": prioritySelect.value || null,
              "tag": tags,
              "mood": selectedMood,
              "comment": commentInput.value
            };
            showToast(formData);
            return;
          }

          if (currentStep < stepMeta.length - 1) {
            currentStep++;
            updateStepUI();
          }
        });

        updateStepUI();
      });
    })();
  </script>
