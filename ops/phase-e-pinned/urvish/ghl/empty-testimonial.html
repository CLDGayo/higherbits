<div class="ghl-component-wrapper">
  <style>
    .ghl-component-wrapper {
      --ghl-primary: #18181b;
      --ghl-primary-fg: #ffffff;
      --ghl-foreground: #09090b;
      --ghl-muted-foreground: #71717a;
      --ghl-background: #ffffff;
      --ghl-neutral-100: #f4f4f5;
      --ghl-neutral-200: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ghl-foreground);
      background-color: var(--ghl-background);
      box-sizing: border-box;
      width: 100%;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .ghl-component-wrapper *,
    .ghl-component-wrapper *::before,
    .ghl-component-wrapper *::after {
      box-sizing: border-box;
    }

    .ghl-component-wrapper .ghl-demo-root {
      display: flex;
      min-height: 320px;
      width: 100%;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
    }

    .ghl-component-wrapper .ghl-testimonial-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 96px;
      padding-bottom: 96px;
      padding-left: 16px;
      padding-right: 16px;
    }

    .ghl-component-wrapper .ghl-header-section {
      margin-bottom: 80px;
      text-align: center;
    }

    .ghl-component-wrapper .ghl-heading-title {
      font-size: 1.875rem;
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--ghl-foreground);
      margin: 0;
      line-height: 1.25;
    }

    @media (min-width: 768px) {
      .ghl-component-wrapper .ghl-heading-title {
        font-size: 2.25rem;
      }
    }

    @media (min-width: 1024px) {
      .ghl-component-wrapper .ghl-heading-title {
        font-size: 3rem;
      }
    }

    .ghl-component-wrapper .ghl-love-badge {
      position: relative;
      cursor: default;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 16px;
      border-radius: 16px;
      background-color: rgba(24, 24, 27, 0.05);
      border: 1px solid rgba(24, 24, 27, 0.1);
      color: var(--ghl-primary);
      transition: background-color 0.3s ease, border-color 0.3s ease;
      vertical-align: middle;
      user-select: none;
    }

    .ghl-component-wrapper .ghl-love-badge:hover {
      background-color: rgba(24, 24, 27, 0.1);
      border-color: rgba(24, 24, 27, 0.2);
    }

    .ghl-component-wrapper .ghl-heart-icon {
      display: inline-block;
      transform-origin: center center;
      transform: scale(1);
    }

    .ghl-component-wrapper .ghl-heart-icon.is-active {
      animation: ghl-heart-pulse 0.7s ease-in-out infinite;
    }

    @keyframes ghl-heart-pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    .ghl-component-wrapper .ghl-folder-trigger {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0 0 48px 0;
      width: 320px;
      height: 208px;
      position: relative;
      cursor: pointer;
      perspective: 1000px;
      -webkit-perspective: 1000px;
      transform-style: preserve-3d;
      display: block;
    }

    .ghl-component-wrapper .ghl-folder-trigger:focus-visible {
      outline: 2px solid var(--ghl-primary);
      outline-offset: 6px;
      border-radius: 16px;
    }

    .ghl-component-wrapper .ghl-folder-back {
      position: relative;
      width: 87.5%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      display: flex;
      justify-content: center;
      border-radius: 12px;
      overflow: visible;
      background-color: #EBEBEB;
      border: 1px solid #D1D1D1;
    }

    .ghl-component-wrapper .ghl-page-card {
      position: absolute;
      top: 8px;
      width: 128px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      transition-property: transform;
      will-change: transform;
      pointer-events: none;
    }

    .ghl-component-wrapper .ghl-page-left {
      z-index: 10;
      transform: translate3d(-38px, 2px, 0) rotate(-3deg);
      transition-duration: 0.6s;
      transition-timing-function: cubic-bezier(0.34, 1.25, 0.64, 1);
    }

    .ghl-component-wrapper .ghl-page-center {
      z-index: 20;
      transform: translate3d(0px, 0px, 0) rotate(0deg);
      transition-duration: 0.55s;
      transition-timing-function: cubic-bezier(0.34, 1.25, 0.64, 1);
    }

    .ghl-component-wrapper .ghl-page-right {
      z-index: 10;
      transform: translate3d(42px, 1px, 0) rotate(3.5deg);
      transition-duration: 0.58s;
      transition-timing-function: cubic-bezier(0.34, 1.25, 0.64, 1);
    }

    .ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-left {
      transform: translate3d(-70px, -75px, 0) rotate(-8deg);
    }

    .ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-center {
      transform: translate3d(2px, -95px, 0) rotate(1deg);
    }

    .ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-page-right {
      transform: translate3d(75px, -80px, 0) rotate(9deg);
    }

    .ghl-component-wrapper .ghl-page-body {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #ffffff, #F5F5F7);
      border-radius: 12px;
      border: 1px solid var(--ghl-neutral-200);
      padding: 16px;
    }

    .ghl-component-wrapper .ghl-page-skeleton {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ghl-component-wrapper .ghl-page-bar-full {
      width: 100%;
      height: 6px;
      background-color: var(--ghl-neutral-100);
      border-radius: 9999px;
    }

    .ghl-component-wrapper .ghl-page-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .ghl-component-wrapper .ghl-page-bar-half {
      flex: 1;
      height: 6px;
      background-color: var(--ghl-neutral-100);
      border-radius: 9999px;
    }

    .ghl-component-wrapper .ghl-folder-flap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      z-index: 30;
      height: 176px;
      border-radius: 24px;
      transform-origin: bottom center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      transform: rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .ghl-component-wrapper .ghl-folder-trigger.is-open .ghl-folder-flap {
      transform: rotateX(-35deg);
    }

    .ghl-component-wrapper .ghl-flap-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .ghl-component-wrapper .ghl-flap-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .ghl-component-wrapper .ghl-flap-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 32px;
      pointer-events: none;
    }

    .ghl-component-wrapper .ghl-flap-eyes {
      display: flex;
      gap: 44px;
      margin-bottom: 10px;
    }

    .ghl-component-wrapper .ghl-flap-eye {
      width: 10px;
      height: 10px;
      background-color: rgba(82, 82, 82, 0.4);
      border-radius: 9999px;
    }

    .ghl-component-wrapper .ghl-flap-mouth {
      width: 36px;
      height: 4px;
      background-color: rgba(82, 82, 82, 0.4);
      border-radius: 9999px;
    }

    .ghl-component-wrapper .ghl-footer-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ghl-component-wrapper .ghl-empty-text {
      font-size: 1.25rem;
      color: var(--ghl-foreground);
      letter-spacing: -0.025em;
      margin: 0;
      line-height: 1.4;
    }

    .ghl-component-wrapper .ghl-empty-subtext {
      font-size: 1.125rem;
      color: var(--ghl-muted-foreground);
      display: inline-block;
      margin-top: 2px;
    }

    .ghl-component-wrapper .ghl-cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background-color: transparent !important;
    }

    .ghl-component-wrapper .ghl-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-radius: 9999px;
      border: 1px dashed rgba(113, 113, 122, 0.3);
      background-color: var(--ghl-background);
      text-decoration: none;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .ghl-component-wrapper .ghl-add-btn:hover {
      border-color: var(--ghl-primary);
      background-color: rgba(24, 24, 27, 0.05);
    }

    .ghl-component-wrapper .ghl-add-icon-wrap {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background-color: var(--ghl-primary);
      color: var(--ghl-primary-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .ghl-component-wrapper .ghl-add-btn:hover .ghl-add-icon-wrap {
      transform: scale(1.08);
    }

    .ghl-component-wrapper .ghl-add-icon-svg {
      width: 16px;
      height: 16px;
      stroke-width: 3;
      display: block;
    }

    .ghl-component-wrapper .ghl-add-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ghl-foreground);
      transition: color 0.3s ease;
    }

    .ghl-component-wrapper .ghl-add-btn:hover .ghl-add-label {
      color: var(--ghl-primary);
    }
  </style>

  <script>
    (function () {
      var wrapper = document.currentScript && document.currentScript.closest(".ghl-component-wrapper");
      if (wrapper) {
        if (wrapper.dataset.ghlInitialized === "true") {
          return;
        }
        wrapper.dataset.ghlInitialized = "true";

        var folderTrigger = wrapper.querySelector(".ghl-folder-trigger");
        var loveBadge = wrapper.querySelector(".ghl-love-badge");
        var heartIcon = wrapper.querySelector(".ghl-heart-icon");

        var isOpen = false;

        if (folderTrigger) {
          folderTrigger.addEventListener("click", function () {
            isOpen = !isOpen;
            folderTrigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
            folderTrigger.classList.toggle("is-open", isOpen);
          });
        }

        if (loveBadge && heartIcon) {
          loveBadge.addEventListener("mouseenter", function () {
            heartIcon.classList.add("is-active");
          });

          loveBadge.addEventListener("mouseleave", function () {
            heartIcon.classList.remove("is-active");
          });
        }
      }
    })();
  </script>
