<div class="ghl-component-wrapper">
  <style>
    .ghl-component-wrapper{--bg:#0b0d12;--card:#11141c;--line:#282d39;--text:#f5f7fb;--muted:#9ba5b6;--accent:#7dd3fc;box-sizing:border-box;width:100%;padding:24px;display:grid;place-items:center;color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .ghl-component-wrapper *{box-sizing:border-box}
    .ghl-component-wrapper .ghl-card{width:min(100%,420px);overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--card);padding:8px;box-shadow:0 24px 60px #0008;transition:transform .35s,box-shadow .35s}
    .ghl-component-wrapper .ghl-card:hover{transform:translateY(-3px);box-shadow:0 30px 70px #0009,0 0 28px #7dd3fc12}
    .ghl-component-wrapper .ghl-viewport{position:relative;height:240px;overflow:hidden;border-radius:24px;background:#ffffff08;touch-action:none;user-select:none}
    .ghl-component-wrapper .ghl-layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:15px;overflow:hidden}
    .ghl-component-wrapper .ghl-layer-reveal{clip-path:circle(48px at var(--lens-x,50%) var(--lens-y,50%));pointer-events:none}
    .ghl-component-wrapper .ghl-row{overflow:hidden;white-space:nowrap}
    .ghl-component-wrapper .ghl-track{display:flex;width:max-content;gap:10px;animation:ghl-marquee 28s linear infinite}
    .ghl-component-wrapper .ghl-track-reverse{animation-name:ghl-marquee-reverse}
    .ghl-component-wrapper .ghl-chip{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #ffffff1c;border-radius:999px;background:#ffffff0a;color:var(--muted);font-size:12px}
    .ghl-component-wrapper .ghl-layer-reveal .ghl-chip{transform:scale(1.12);background:#171d29;border-color:#7dd3fc55;color:var(--accent);box-shadow:0 3px 16px #0005}
    .ghl-component-wrapper .ghl-mark{width:8px;height:8px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(45deg);opacity:.9}
    .ghl-component-wrapper .ghl-lens{position:absolute;z-index:3;width:96px;height:96px;border:7px solid #e4edf3;border-radius:50%;background:#ffffff12;box-shadow:inset 0 0 0 4px #71808b,0 8px 18px #0008;cursor:grab;touch-action:none}
    .ghl-component-wrapper .ghl-lens:active{cursor:grabbing}
    .ghl-component-wrapper .ghl-lens:after{content:"";position:absolute;width:35px;height:13px;right:-25px;bottom:-13px;border:3px solid #d4dfe6;border-radius:8px;background:#59636c;transform:rotate(47deg);box-shadow:0 3px 7px #0007}
    .ghl-component-wrapper .ghl-copy{padding:20px 16px 18px}
    .ghl-component-wrapper .ghl-copy h3{margin:0;color:var(--text);font-size:20px;font-weight:600;letter-spacing:-.03em}
    .ghl-component-wrapper .ghl-copy p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
    @keyframes ghl-marquee{to{transform:translateX(-33.333%)}}
    @keyframes ghl-marquee-reverse{from{transform:translateX(-33.333%)}to{transform:translateX(0)}}
    @media(max-width:480px){.ghl-component-wrapper{padding:12px}.ghl-component-wrapper .ghl-viewport{height:220px}.ghl-component-wrapper .ghl-copy{padding:17px 12px}}
    @media(prefers-reduced-motion:reduce){.ghl-component-wrapper .ghl-card{transition:none}.ghl-component-wrapper .ghl-track{animation-duration:70s}}
  </style>
  <div class="ghl-card">
    <div class="ghl-viewport" data-ghl-viewport="">
      <div class="ghl-layer" data-ghl-base=""></div>
      <div class="ghl-layer ghl-layer-reveal" data-ghl-reveal="" aria-hidden="true"></div>
      <div class="ghl-lens" data-ghl-lens="" role="slider" tabindex="0" aria-label="Drag to magnify workflow chips" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
    </div>
    <div class="ghl-copy"><h3>Intelligent Workflows</h3><p>Automatically categorize and search through your team's diverse skillsets and project phases with contextual awareness.</p></div>
  </div>
  <script>
    (()=>{const root=document.currentScript?.closest('.ghl-component-wrapper');if(!root||root.dataset.magnifierReady)return;root.dataset.magnifierReady='true';const viewport=root.querySelector('[data-ghl-viewport]'),lens=root.querySelector('[data-ghl-lens]'),labels=[['Discovery','Client Review','System Design','DevOps Integration','Post-Launch Support'],['QA & Optimization','Launch & Deploy','Full-Stack Development','Analytics','MVP Engineering'],['API & Backend','Mobile Development','Cloud Infrastructure','Database Design','Security']];const fill=layer=>labels.forEach((items,rowIndex)=>{const row=document.createElement('div'),track=document.createElement('div');row.className='ghl-row';track.className='ghl-track'+(rowIndex%2?' ghl-track-reverse':'');for(let copy=0;copy<3;copy++)items.forEach(label=>{const chip=document.createElement('span'),mark=document.createElement('i');chip.className='ghl-chip';mark.className='ghl-mark';mark.setAttribute('aria-hidden','true');chip.append(mark,document.createTextNode(label));track.append(chip)});row.append(track);layer.append(row)});fill(root.querySelector('[data-ghl-base]'));fill(root.querySelector('[data-ghl-reveal]'));let x,y,dragging=false;const move=(clientX,clientY)=>{const box=viewport.getBoundingClientRect();x=Math.max(48,Math.min(box.width-48,clientX-box.left));y=Math.max(48,Math.min(box.height-48,clientY-box.top));viewport.style.setProperty('--lens-x',x+'px');viewport.style.setProperty('--lens-y',y+'px');lens.style.left=x+'px';lens.style.top=y+'px';lens.style.transform='translate(-50%,-50%)';lens.setAttribute('aria-valuenow',String(Math.round(x/box.width*100)))};move(viewport.getBoundingClientRect().left+viewport.clientWidth/2,viewport.getBoundingClientRect().top+viewport.clientHeight/2);lens.addEventListener('pointerdown',event=>{dragging=true;lens.setPointerCapture(event.pointerId);event.preventDefault()});lens.addEventListener('pointermove',event=>{if(dragging)move(event.clientX,event.clientY)});lens.addEventListener('pointerup',()=>{dragging=false});lens.addEventListener('pointercancel',()=>{dragging=false});lens.addEventListener('keydown',event=>{const step=event.shiftKey?24:12;if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const box=viewport.getBoundingClientRect();move(box.left+x+(event.key==='ArrowRight'?step:event.key==='ArrowLeft'?-step:0),box.top+y+(event.key==='ArrowDown'?step:event.key==='ArrowUp'?-step:0))})})();
  </script>
</div>
