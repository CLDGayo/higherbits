<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arikchakma - cromia-compact</title>
  <style>
    body { margin: 0; padding: 0; background: #fafafa; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div class="ghl-component-wrapper" role="region" aria-label="Cromia compact picker">
  <style>
    .ghl-component-wrapper {
      width: 100%;
      min-height: 480px;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #fafafa;
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
      color: #09090b;
    }
    .ghl-card {
      width: min(100%, 320px);
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .ghl-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .ghl-trigger-left { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 13px; }
    .ghl-dot { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; }
    .ghl-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .ghl-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
  <div class="ghl-card">
    <div class="ghl-trigger">
      <div class="ghl-trigger-left"><span class="ghl-dot"></span>Theme Color</div>
      <span style="font-family: monospace; font-size: 12px; color: #71717a;">#2563EB</span>
    </div>
    <div class="ghl-swatches">
      <div class="ghl-swatch" style="background: #ef4444;"></div>
      <div class="ghl-swatch" style="background: #f97316;"></div>
      <div class="ghl-swatch" style="background: #eab308;"></div>
      <div class="ghl-swatch" style="background: #10b981;"></div>
      <div class="ghl-swatch" style="background: #06b6d4;"></div>
      <div class="ghl-swatch" style="background: #2563eb; outline: 2px solid #09090b;"></div>
      <div class="ghl-swatch" style="background: #8b5cf6;"></div>
      <div class="ghl-swatch" style="background: #ec4899;"></div>
      <div class="ghl-swatch" style="background: #64748b;"></div>
      <div class="ghl-swatch" style="background: #09090b;"></div>
    </div>
  </div>
</div>

</body>
</html>
