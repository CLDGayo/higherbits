  <script>
    (function() {
      var textarea = document.getElementById("ghl-8-prompt");
      var dropBtn = document.getElementById("ghl-8-dropbtn");
      var menu = document.getElementById("ghl-8-menu");
      var providerUrls = {
        chatgpt: "https://chatgpt.com/?q=",
        claude: "https://claude.ai/new?q=",
        perplexity: "https://www.perplexity.ai/search/new?q=",
        grok: "https://grok.com/?q=",
        v0: "https://v0.app/chat?q="
      };

      function updateLinks() {
        var text = encodeURIComponent(textarea.value || "");
        var links = document.querySelectorAll("[data-provider]");
        links.forEach(function(link) {
          var p = link.getAttribute("data-provider");
          if (providerUrls[p]) {
            link.href = providerUrls[p] + text;
          }
        });
      }

      if (dropBtn && menu) {
        dropBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          menu.classList.toggle("open");
          dropBtn.setAttribute("aria-expanded", menu.classList.contains("open") ? "true" : "false");
        });
        document.addEventListener("click", function(e) {
          if (!menu.contains(e.target) && e.target !== dropBtn) {
            menu.classList.remove("open");
            dropBtn.setAttribute("aria-expanded", "false");
          }
        });
      }

      if (textarea) {
        textarea.addEventListener("input", updateLinks);
        updateLinks();
      }
    })();
  </script>
