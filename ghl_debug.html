<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tabsList = document.querySelector('[role="tablist"]');
    const tabTriggers = tabsList ? Array.from(tabsList.querySelectorAll('[role="tab"]')) : [];
    const tabContents = Array.from(document.querySelectorAll('[role="tabpanel"]'));

    if (tabTriggers.length === 0 || tabContents.length === 0) {
      console.warn("Tabs component: Could not find tab triggers or content panels.");
      return;
    }

    // Set initial state based on data-state="active" or default to the first tab
    let activeTrigger = tabTriggers.find(trigger => trigger.getAttribute('data-state') === 'active');
    let activeContent = tabContents.find(content => content.getAttribute('data-state') === 'active');

    if (!activeTrigger && tabTriggers.length > 0) {
      activeTrigger = tabTriggers[0];
      activeTrigger.setAttribute('data-state', 'active');
      activeTrigger.setAttribute('aria-selected', 'true');
      activeTrigger.setAttribute('tabindex', '0');
    }
    if (!activeContent && activeTrigger) {
      const targetId = activeTrigger.getAttribute('aria-controls');
      activeContent = tabContents.find(content => content.id === targetId);
      if (activeContent) {
        activeContent.setAttribute('data-state', 'active');
        activeContent.removeAttribute('hidden'); // Ensure it's visible
      }
    }

    // Ensure all other contents are hidden initially
    tabContents.forEach(content => {
      if (content !== activeContent) {
        content.setAttribute('data-state', 'inactive');
        content.setAttribute('hidden', ''); // Use hidden attribute for accessibility and display:none
      }
    });

    tabTriggers.forEach(trigger => {
      trigger.addEventListener('click', (event) => {
        const clickedTrigger = event.currentTarget;
        const targetId = clickedTrigger.getAttribute('aria-controls');
        const targetContent = document.getElementById(targetId);

        // Deactivate current active tab
        const currentActiveTrigger = tabsList.querySelector('[data-state="active"]');
        const currentActiveContent = document.querySelector('[role="tabpanel"][data-state="active"]');

        if (currentActiveTrigger) {
          currentActiveTrigger.setAttribute('data-state', 'inactive');
          currentActiveTrigger.setAttribute('aria-selected', 'false');
          currentActiveTrigger.setAttribute('tabindex', '-1');
        }
        if (currentActiveContent) {
          currentActiveContent.setAttribute('data-state', 'inactive');
          currentActiveContent.setAttribute('hidden', ''); // Hide the content
        }

        // Activate clicked tab
        clickedTrigger.setAttribute('data-state', 'active');
        clickedTrigger.setAttribute('aria-selected', 'true');
        clickedTrigger.setAttribute('tabindex', '0');
        if (targetContent) {
          targetContent.setAttribute('data-state', 'active');
          targetContent.removeAttribute('hidden'); // Show the content
        }
      });
    });
  });
</script>
