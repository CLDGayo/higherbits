<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project timeline — HigherBits local adaptation</title>
  <style>
    .hb-timeline{box-sizing:border-box;max-width:720px;margin:24px auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#27272a;background:#fafafa}
    .hb-timeline h1{font-size:24px;line-height:1.25;margin:0 0 24px}
    .hb-timeline ol{list-style:none;margin:0;padding:0 0 0 32px;border-left:2px solid #cbd5e1}
    .hb-timeline li{position:relative;margin:0 0 22px;padding:16px 18px;border:1px solid #e4e4e7;border-radius:10px;background:white;box-shadow:0 2px 8px #18181b0a}
    .hb-timeline li:last-child{margin-bottom:0}
    .hb-timeline li:before{content:"";position:absolute;left:-41px;top:20px;width:14px;height:14px;border:3px solid #fafafa;border-radius:50%;background:#7c3aed;box-shadow:0 0 0 2px #7c3aed}
    .hb-timeline time{display:block;color:#52525b;font-size:13px;font-weight:600}
    .hb-timeline h2{font-size:17px;margin:5px 0}.hb-timeline p{margin:0;color:#52525b}
    @media(max-width:480px){.hb-timeline{padding:16px}.hb-timeline ol{padding-left:22px}.hb-timeline li:before{left:-31px}}
  </style>
</head>
<body>
  <main class="hb-timeline">
    <h1>Project milestones</h1>
    <ol>
      <li><time datetime="2026-01-08">January 8, 2026</time><h2>Idea</h2><p>Set the goal and agree on the first milestone.</p></li>
      <li><time datetime="2026-02-12">February 12, 2026</time><h2>Design</h2><p>Turn the plan into a working prototype.</p></li>
      <li><time datetime="2026-03-20">March 20, 2026</time><h2>Launch</h2><p>Release the finished experience.</p></li>
    </ol>
  </main>
</body>
</html>
