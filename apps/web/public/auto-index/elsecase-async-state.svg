<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">AsyncState component preview</title><desc id="description">An error state with a retry action in a workspace members panel.</desc>
  <rect width="640" height="400" fill="#fff"/><rect x="84" y="28" width="472" height="344" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="110" y="69" fill="#0f172a" font-size="19" font-family="system-ui" font-weight="700">Workspace members</text>
  <text x="110" y="94" fill="#64748b" font-size="14" font-family="system-ui">Choose a response to preview each state.</text>
  <text x="110" y="129" fill="#0f172a" font-size="14" font-family="system-ui" font-weight="600">Response</text>
  <rect x="110" y="140" width="420" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="123" y="168" fill="#0f172a" font-size="15" font-family="system-ui">error</text><path d="m503 157 7 7 7-7" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="110" y="204" width="420" height="144" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="134" y="242" fill="#0f172a" font-size="16" font-family="system-ui" font-weight="700">Something went wrong</text>
  <text x="134" y="266" fill="#64748b" font-size="14" font-family="system-ui">The request could not be completed.</text>
  <rect x="134" y="282" width="102" height="44" rx="6" fill="#0f172a"/><text x="150" y="309" fill="#fff" font-size="14" font-family="system-ui">Try again</text>
</svg>
