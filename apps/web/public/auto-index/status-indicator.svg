<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Status Indicator component preview</title>
  <desc id="description">Four service states and small and large status dots, based on the pinned Status Indicator demo.</desc>
  <rect width="640" height="400" fill="#fafafa"/>
  <rect x="128" y="49" width="384" height="302" rx="16" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="164" y="94" fill="#18181b" font-size="23" font-family="system-ui,sans-serif" font-weight="600">Service status</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#334155">
    <circle cx="176" cy="135" r="7" fill="#22c55e"/><text x="197" y="141">All systems operational</text>
    <circle cx="176" cy="178" r="7" fill="#ef4444"/><text x="197" y="184">Systems down</text>
    <circle cx="176" cy="221" r="7" fill="#334155"/><text x="197" y="227">Systems idle</text>
    <circle cx="176" cy="264" r="7" fill="#eab308"/><text x="197" y="270">Diagnosing issue, fixing</text>
    <circle cx="176" cy="307" r="4" fill="#22c55e"/><text x="197" y="313">Small size</text>
    <circle cx="363" cy="307" r="10" fill="#eab308"/><text x="383" y="313">Large size</text>
  </g>
</svg>
