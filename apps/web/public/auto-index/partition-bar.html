<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruit harvest — HigherBits local adaptation</title>
  <style>
    .hb-partition{box-sizing:border-box;max-width:520px;margin:32px auto;padding:28px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;font:16px/1.5 system-ui,sans-serif;color:#0f172a}
    .hb-partition *{box-sizing:border-box}.hb-partition h1{margin:0 0 24px;font-size:22px;line-height:1.25}
    .hb-partition ul{display:flex;gap:8px;margin:0;padding:0;list-style:none}.hb-partition li{min-width:0;flex:none}.hb-partition li:first-child{width:calc((100% - 8px)*.3)}.hb-partition li:last-child{width:calc((100% - 8px)*.7)}
    .hb-partition .bar{height:12px;border-radius:999px;background:#7c3aed}.hb-partition li:last-child .bar{background:#b698ed}
    .hb-partition .label{display:flex;flex-direction:column;align-items:center;margin-top:12px;text-align:center;color:#7c3aed}.hb-partition li:last-child .label{color:#8860c8}
    .hb-partition strong{font-size:14px}.hb-partition span{font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <section class="hb-partition" aria-label="Fruit harvest split">
    <h1>Fruit harvest</h1>
    <ul>
      <li><div class="bar"></div><div class="label"><strong>Apples</strong><span>30%</span></div></li>
      <li><div class="bar"></div><div class="label"><strong>Oranges</strong><span>70%</span></div></li>
    </ul>
  </section>
</body>
</html>
