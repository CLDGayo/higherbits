<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AsyncState preview</title><style>
body{font:15px/1.5 system-ui,sans-serif;color:#0f172a;background:#fff;margin:0;padding:24px}.demo{box-sizing:border-box;max-width:512px;margin:0 auto;padding:24px;border:1px solid #e2e8f0;border-radius:12px}.demo h1{font-size:19px;margin:0 0 2px}.hint{color:#64748b;margin:0 0 20px;font-size:14px}label{display:block;font-weight:600;margin-bottom:8px}select{box-sizing:border-box;width:100%;min-height:44px;padding:8px 12px;margin-bottom:20px;background:#fff;border:1px solid #cbd5e1;border-radius:6px;font:inherit}.state{min-height:160px;box-sizing:border-box;padding:24px;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:10px}.state strong{font-size:16px}.state p{color:#64748b;margin:0;font-size:14px}.state button{align-self:flex-start;min-height:44px;padding:8px 16px;color:#fff;background:#0f172a;border:0;border-radius:6px;font:inherit;cursor:pointer}.state button:focus-visible,select:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.skeleton{width:75%;height:12px;border-radius:20px;background:#e2e8f0}.skeleton:nth-child(2){width:100%}.skeleton:nth-child(3){width:60%}.refreshing{font-size:12px;color:#475569}
</style></head><body><main class="demo"><h1>Workspace members</h1><p class="hint">Choose a response to preview each state.</p><label for="status">Response</label><select id="status"><option>loading</option><option>success</option><option>empty</option><option selected>error</option><option>offline</option><option>forbidden</option><option>refreshing</option></select><div class="state" id="state" role="alert" aria-live="assertive"><strong>Something went wrong</strong><p>The request could not be completed.</p><button type="button" id="retry">Try again</button></div></main><script>
const select=document.getElementById('status'),panel=document.getElementById('state');const content={empty:['No results','There is nothing to show yet.'],error:['Something went wrong','The request could not be completed.'],offline:['You are offline','Check your connection and try again.'],forbidden:['Access denied','You do not have permission to view this content.']};function render(){const status=select.value;panel.setAttribute('role',status==='error'||status==='offline'||status==='forbidden'?'alert':'status');panel.setAttribute('aria-live',status==='error'||status==='offline'||status==='forbidden'?'assertive':'polite');if(status==='loading'){panel.innerHTML='<span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>';return}if(status==='success'||status==='refreshing'){panel.innerHTML=(status==='refreshing'?'<span class="refreshing">● Refreshing content</span>':'')+'<strong>12 active members</strong><p>The latest workspace response is ready.</p>';return}const [label,description]=content[status];panel.innerHTML='<strong>'+label+'</strong><p>'+description+'</p>'+(status==='error'||status==='offline'?'<button type="button" id="retry">Try again</button>':'')}select.addEventListener('change',render);panel.addEventListener('click',event=>{if(event.target.id==='retry'){select.value='success';render()}})
</script></body></html>
