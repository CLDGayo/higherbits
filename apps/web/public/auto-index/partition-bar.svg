<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Partition Bar illustrative thumbnail</title>
  <desc id="description">Fruit harvest divided into thirty percent apples and seventy percent oranges.</desc>
  <rect width="640" height="400" fill="#fafafa"/>
  <rect x="56" y="72" width="528" height="256" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <text x="88" y="126" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#0f172a">Fruit harvest</text>
  <rect x="88" y="180" width="127" height="15" rx="7" fill="#7c3aed"/>
  <rect x="225" y="180" width="327" height="15" rx="7" fill="#b698ed"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="151" y="238" font-size="17" font-weight="600" fill="#7c3aed">Apples</text>
    <text x="151" y="262" font-size="14" fill="#64748b">30%</text>
    <text x="389" y="238" font-size="17" font-weight="600" fill="#8860c8">Oranges</text>
    <text x="389" y="262" font-size="14" fill="#64748b">70%</text>
  </g>
</svg>
