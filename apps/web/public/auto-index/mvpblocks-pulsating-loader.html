<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulsating Loader preview</title><style>body{margin:0;padding:32px;background:#fff;font:14px/1.5 system-ui,sans-serif;color:#64748b}.demo{box-sizing:border-box;max-width:448px;min-height:192px;margin:0 auto;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border:1px solid #e2e8f0;border-radius:16px}.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#ef4444;animation:pulse 1s ease-in-out infinite}.dot:nth-child(2){animation-delay:.3s}.dot:nth-child(3){animation-delay:.6s}p{margin:0}@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}@media(prefers-reduced-motion:reduce){.dot{animation:none;opacity:1}}</style></head><body><div class="demo"><div class="dots" role="status" aria-label="Loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p>Loading your content</p></div></body></html>
