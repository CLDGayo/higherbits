<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">HigherBits illustrative component previews</title>
  <desc id="description">An original illustration of a content card, form, and status panel. These are illustrative component examples, not a screenshot of a working product.</desc>
  <rect width="1440" height="900" fill="#F9F6F1"/>
  <g font-family="sans-serif" fill="#392F2A">
    <text x="64" y="90" font-size="30" font-weight="700">HigherBits.dev</text>
    <rect x="1044" y="51" width="332" height="50" rx="25" fill="#E9E1F5"/>
    <text x="1210" y="83" font-size="17" text-anchor="middle" font-weight="700" letter-spacing="2">ILLUSTRATIVE EXAMPLES</text>
    <path d="M64 132H1376" stroke="#D6CEDF"/>
    <text x="64" y="213" font-size="52" font-weight="700" letter-spacing="-1">Small details. Distinct character.</text>
    <text x="64" y="257" font-size="22" fill="#675B54">Original component studies in shape, space, and contrast.</text>

    <rect x="64" y="312" width="416" height="466" rx="24" fill="#FFFFFF" stroke="#DDD5CB"/>
    <text x="92" y="358" font-size="16" font-weight="700" letter-spacing="2" fill="#675B54">CONTENT CARD</text>
    <rect x="92" y="386" width="360" height="174" rx="16" fill="#E9E1F5"/>
    <circle cx="272" cy="473" r="61" fill="#B3A0D8"/>
    <rect x="214" y="427" width="116" height="92" rx="22" transform="rotate(-12 272 473)" fill="#F9F6F1"/>
    <rect x="246" y="447" width="52" height="52" rx="14" transform="rotate(12 272 473)" fill="#392F2A"/>
    <text x="92" y="610" font-size="30" font-weight="700">A little room to breathe</text>
    <text x="92" y="649" font-size="20" fill="#675B54">A study in balance and soft edges.</text>
    <rect x="92" y="690" width="160" height="52" rx="26" fill="#392F2A"/>
    <text x="172" y="723" font-size="18" fill="#FFFFFF" text-anchor="middle">Explore</text>

    <rect x="512" y="312" width="416" height="466" rx="24" fill="#29242F"/>
    <text x="540" y="358" font-size="16" font-weight="700" letter-spacing="2" fill="#D7C9ED">FORM STUDY</text>
    <text x="540" y="425" font-size="32" font-weight="700" fill="#FAF7F2">Make space for an idea.</text>
    <text x="540" y="466" font-size="20" fill="#D7CFDE">A simple note, thoughtfully framed.</text>
    <text x="540" y="518" font-size="18" fill="#FAF7F2">Note title</text>
    <rect x="540" y="537" width="360" height="62" rx="12" fill="#37313F" stroke="#8F819E"/>
    <text x="560" y="576" font-size="20" fill="#DED4E8">An afternoon sketch</text>
    <rect x="540" y="623" width="360" height="59" rx="12" fill="#BFAAE5"/>
    <text x="720" y="660" font-size="20" font-weight="700" text-anchor="middle" fill="#29242F">Save note</text>
    <text x="540" y="729" font-size="17" fill="#D7CFDE">Illustration only · no interactive controls</text>

    <rect x="960" y="312" width="416" height="466" rx="24" fill="#EEE7F6" stroke="#D6C9E5"/>
    <text x="988" y="358" font-size="16" font-weight="700" letter-spacing="2" fill="#675B54">STATUS PANEL</text>
    <rect x="988" y="386" width="360" height="356" rx="18" fill="#FDFBF8"/>
    <circle cx="1168" cy="475" r="48" fill="#E9E1F5"/>
    <path d="M1148 475L1162 489L1189 460" fill="none" stroke="#55416E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1168" y="565" font-size="30" text-anchor="middle" font-weight="700">Everything in its place</text>
    <text x="1168" y="605" font-size="20" text-anchor="middle" fill="#675B54">A calm moment of confirmation.</text>
    <rect x="1068" y="651" width="200" height="52" rx="26" fill="#FDFBF8" stroke="#675B54"/>
    <text x="1168" y="684" font-size="18" text-anchor="middle">Back to overview</text>

    <text x="64" y="843" font-size="18" fill="#675B54">ILLUSTRATION · Component examples, not a product screenshot.</text>
    <text x="1376" y="843" font-size="18" text-anchor="end" fill="#675B54">HigherBits.dev</text>
  </g>
</svg>
